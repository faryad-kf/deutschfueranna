<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#172033; --muted:#66708A; --line:#E1E6F0;
  --der:#3F72D9; --die:#D9506A; --das:#2A9D6B;
  --der-s:#E5EDFC; --die-s:#FBE5EA; --das-s:#DEF2E9;
  --gold:#F2B93B; --gold-s:#FFF3D3;
  --shadow:0 1px 2px rgba(23,32,51,.05),0 10px 28px rgba(23,32,51,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1420; --card:#182031; --ink:#EEF1F8; --muted:#9AA5BD; --line:#26304A;
    --der:#7AA2F2; --die:#F17C93; --das:#55C596;
    --der-s:#1B2A4A; --die-s:#3A2030; --das-s:#173328;
    --gold:#F2B93B; --gold-s:#3A3116; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1420; --card:#182031; --ink:#EEF1F8; --muted:#9AA5BD; --line:#26304A;
  --der:#7AA2F2; --die:#F17C93; --das:#55C596;
  --der-s:#1B2A4A; --die-s:#3A2030; --das-s:#173328;
  --gold:#F2B93B; --gold-s:#3A3116; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3,p{margin:0}
.c-der{color:var(--der)} .c-die{color:var(--die)} .c-das{color:var(--das)}

/* home */
.hero{padding:10px 2px 18px}
.hero h1{font-size:46px;line-height:1;font-weight:800;letter-spacing:-1.5px;display:flex;gap:12px;flex-wrap:wrap}
.hero p{margin-top:10px;color:var(--muted);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 18px}
.stat{padding:2px 0 2px 14px;border-left:3px solid var(--gold)}
.stat:nth-child(n+2){margin-left:10px}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.card + .card,.card + .btn,.btn + .card{margin-top:14px}
.lbl{font-size:14px;font-weight:650;color:var(--muted);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:650;color:var(--muted);font-size:15px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,32,51,.14)}
select,.search{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px 20px;font-size:17px;font-weight:700;background:var(--ink);color:var(--card);text-align:center}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#172033}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:6px;transition:width .3s}
.bar i.seen{opacity:.4}
.pill{font-weight:700;font-size:14px;background:var(--gold-s);border-radius:999px;padding:5px 12px;white-space:nowrap}
.icon{border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon.on{color:var(--gold)}
.qcard{text-align:center;padding:30px 18px 24px;min-height:250px}
.noun{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1;word-break:break-word}
.noun .art{font-weight:800}
.tr{margin-top:14px;color:var(--muted);font-size:17px;display:flex;flex-direction:column;gap:2px}
.tr .uk{color:var(--ink)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.art-btn{height:76px;border-radius:22px;border:0;font-size:26px;font-weight:800;letter-spacing:-.3px;transition:transform .08s,opacity .2s}
.art-btn:active:not(:disabled){transform:scale(.95)}
.art-btn.der{background:var(--der-s);color:var(--der)}
.art-btn.die{background:var(--die-s);color:var(--die)}
.art-btn.das{background:var(--das-s);color:var(--das)}
.art-btn.right.der{background:var(--der);color:var(--card)}
.art-btn.right.die{background:var(--die);color:var(--card)}
.art-btn.right.das{background:var(--das);color:var(--card)}
.art-btn.wrong{opacity:.55;text-decoration:line-through;animation:shake .35s}
.art-btn.dim{opacity:.35}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.fb{margin-top:18px;padding:12px 14px;border-radius:16px;text-align:left;font-weight:600}
.fb.ok{background:var(--gold-s)}
.fb.no{background:var(--bg)}
.fb .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tip{margin-top:8px;font-size:14.5px;font-weight:500;color:var(--muted);line-height:1.4}
.tip b{color:var(--ink)}
.res{text-align:center;padding:28px 18px}
.res .big{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.res p{margin-top:8px;color:var(--muted);font-size:17px}
.mist{margin-top:20px;text-align:left}
.mist h3{font-size:14px;color:var(--muted);font-weight:650;margin-bottom:4px}

/* cases */
.sentence{font-size:26px;font-weight:700;line-height:1.35;letter-spacing:-.3px;margin-top:6px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--gold);text-align:center;margin:0 2px}
.blank.filled{border-bottom-color:transparent;font-weight:800;min-width:0;margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.opt{flex:1 1 28%;height:60px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-size:21px;font-weight:700}
.opt:active:not(:disabled){transform:scale(.96)}
.opt.right{background:var(--ink);color:var(--card);border-color:var(--ink)}
.opt.wrong{opacity:.5;text-decoration:line-through;animation:shake .35s}
.opt.dim{opacity:.35}
.tag{display:inline-block;margin-bottom:12px;background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:650;color:var(--muted)}

/* lists */
.row{display:flex;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rw{flex:1;min-width:0}
.rw .w{font-size:18px;font-weight:700}
.rw .w .a{font-weight:800;margin-right:5px}
.rw .t{font-size:14px;color:var(--muted)}
.h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:4px 2px 14px}
.sec{margin-top:22px}
.prog{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:10px 0}
.prog .bar{grid-column:1/-1;height:6px}
.prog .n{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;text-align:center;font-size:17px;font-weight:650}
.tbl th{font-size:13.5px;color:var(--muted);font-weight:650;padding:6px 4px;text-align:center}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl td:first-child,.tbl tbody th{color:var(--muted);font-size:13.5px;font-weight:650}
.tbl .later{opacity:.5}
.rl p{margin:6px 0;font-size:15.5px}
.rl b{font-weight:750}
.two{display:grid;gap:12px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:10px;font:inherit;background:var(--card);color:var(--ink);margin-top:10px}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;color:var(--muted);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:650;position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:650;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<div class="tabbar"><nav id="nav"></nav></div>

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function markDay(){const t=fmt(new Date());if(S.days[S.days.length-1]!==t){S.days.push(t);if(S.days.length>120)S.days.shift();}}
function dayStreak(){
  const set=new Set(S.days);const d=new Date();let n=0;
  if(!set.has(fmt(d)))d.setDate(d.getDate()-1);
  while(set.has(fmt(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function stats(){
  let learned=0,seen=0,r=0,w=0;
  WORDS.forEach(e=>{const s=S.w[e.id];if(s){seen++;r+=s.r;w+=s.w;if(s.b>=3)learned++;}});
  return {learned,seen,acc:(r+w)?Math.round(100*r/(r+w)):0};
}

function pool(){return WORDS.filter(e=>(cfg.grp==='all'||e.grp===cfg.grp)&&(cfg.cat==='all'||e.cat===cfg.cat));}
function weight(e){const s=S.w[e.id];if(!s)return 5;return [6,4,2.5,1.2,.5][s.b];}
function pickWords(p,n){
  const a=p.slice(),out=[];
  while(out.length<n&&a.length){
    const tot=a.reduce((t,e)=>t+weight(e),0);
    let r=Math.random()*tot,i=0;
    for(;i<a.length;i++){r-=weight(a[i]);if(r<=0)break;}
    if(i>=a.length)i=a.length-1;
    out.push(a.splice(i,1)[0]);
  }
  return out;
}

/* ---------- Üben (Artikel) ---------- */
function startRound(){
  const picks=pickWords(pool(),10);
  if(!picks.length)return;
  Q={queue:picks,pos:0,answered:false,chosen:null,ok:false,streak:0,firstOk:0,n:picks.length,wrongs:[],seen:{},requeued:{},done:false,timer:null};
  render();
}
function answer(a){
  if(!Q||Q.answered||Q.done)return;
  const e=Q.queue[Q.pos];const ok=a===e.art;
  Q.answered=true;Q.chosen=a;Q.ok=ok;
  const s=S.w[e.id]||(S.w[e.id]={b:0,r:0,w:0});
  const first=!Q.seen[e.id];Q.seen[e.id]=1;
  if(ok){s.r++;s.b=Math.min(4,s.b+1);Q.streak++;if(first)Q.firstOk++;}
  else{
    s.w++;s.b=Math.max(0,s.b-2);Q.streak=0;
    if(Q.wrongs.indexOf(e)<0)Q.wrongs.push(e);
    if(!Q.requeued[e.id]){Q.requeued[e.id]=1;Q.queue.splice(Math.min(Q.queue.length,Q.pos+4),0,e);}
  }
  markDay();save();render();
}
function next(){
  if(!Q)return;
  clearTimeout(Q.timer);
  Q.pos++;Q.answered=false;Q.chosen=null;
  if(Q.pos>=Q.queue.length)Q.done=true;
  render();
}
function quit(){if(Q)clearTimeout(Q.timer);Q=null;render();}

function viewQuestion(){
  const e=Q.queue[Q.pos];const done=Q.answered;
  const pr=Math.round(Q.pos/Q.queue.length*100);
  let h='<div class="qtop"><button class="icon" data-a="quit" aria-label="Beenden">'+ic(IC.close)+'</button>'+
    '<div class="bar"><i style="width:'+pr+'%"></i></div><div class="pill">Serie '+Q.streak+'</div></div>';
  h+='<div class="card qcard"><div class="noun'+(done?' c-'+e.art:'')+'" style="font-size:'+nounSize(e.w)+'px">'+(done?'<span class="art">'+e.art+'</span> ':'')+esc(e.w)+'</div>'+
    '<div class="tr">'+trans(e)+'</div>';
  if(done){
    const tip=hintFor(e);
    h+='<div class="fb '+(Q.ok?'ok':'no')+'"><div class="row1"><span>'+(Q.ok?'Richtig!':'Nicht ganz. Es heißt: <span class="c-'+e.art+'">'+e.art+' '+esc(e.w)+'</span>')+'</span>'+
      (canSpeak?'<button class="icon" data-a="say" data-v="'+e.i+'" aria-label="Vorlesen">'+ic(IC.speaker)+'</button>':'')+'</div>'+
      (tip?'<div class="tip">'+tip+'</div>':'')+'</div>';
  }
  h+='</div><div class="arts">';
  ['der','die','das'].forEach(a=>{
    let st='';
    if(done)st=a===e.art?' right':(a===Q.chosen?' wrong':' dim');
    h+='<button class="art-btn '+a+st+'" data-a="ans" data-v="'+a+'"'+(done?' disabled':'')+'>'+a+'</button>';
  });
  h+='</div>';
  if(done)h+='<button class="btn" data-a="next">Weiter</button>';
  return h;
}
function viewResult(){
  const r=Q.firstOk/Q.n;
  const msg=r>=.9?'Sehr gut!':r>=.6?'Gut gemacht!':'Jeder Fehler hilft beim Lernen. Weiter so!';
  let h='<div class="card res"><div class="big">'+Q.firstOk+'/'+Q.n+'</div><p>'+msg+'</p>';
  if(Q.wrongs.length){
    h+='<div class="mist"><h3>Diese Wörter noch einmal ansehen</h3>'+Q.wrongs.map(rowSimple).join('')+'</div>';
  }
  h+='</div><button class="btn gold" style="margin-top:14px" data-a="start">Nächste Runde</button>'+
    '<button class="btn ghost" style="margin-top:10px" data-a="quit">Fertig</button>';
  return h;
}
function rowSimple(e){
  return '<div class="row"><div class="rw"><div class="w"><span class="a c-'+e.art+'">'+e.art+'</span>'+esc(e.w)+'</div><div class="t">'+
    [S.en?esc(e.en):'',S.uk?esc(e.uk):''].filter(Boolean).join(' / ')+'</div></div></div>';
}

/* ---------- Fälle ---------- */
const CASE_SETS={nom:['nom'],akk:['akk'],dat:['dat'],wo:['wod','woa'],mix:['nom','akk','dat','wod','woa']};
const CSKEY={nom:'nom',akk:'akk',dat:'dat',wod:'dat',woa:'akk'};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildBag(){
  const set=CASE_SETS[C.mode];
  return shuffle(SENT.filter(x=>set.indexOf(x.c)>=0&&(C.indef?x.f!=='d':x.f!=='i')));
}
function newCase(){
  const k=C.mode+(C.indef?'i':'d');
  let bag=C.bag[k];
  if(!bag||!bag.length)bag=C.bag[k]=buildBag();
  let idx=0;
  if(C.last){
    let j=bag.findIndex(x=>x.h!==C.last.h&&x.e!==C.last.e);
    if(j<0)j=bag.findIndex(x=>x.e!==C.last.e);
    if(j>0)idx=j;
  }
  const sn=bag.splice(idx,1)[0];
  C.last=sn;
  const cs=CSKEY[sn.c];
  C.q={s:sn,e:sn.e,cs:cs,form:ART[C.indef?'i':'d'][cs][sn.e.art],key:k};
  C.ans=null;
}
function caseAnswer(v){
  if(C.ans||!C.q)return;
  const q=C.q,ok=v===q.form;
  C.ans=v;C.total++;
  const g=(q.s.c==='wod'||q.s.c==='woa')?'wo':q.s.c;
  const st=S.cs[g]||(S.cs[g]=[0,0]);
  st[1]++;
  if(ok){C.right++;C.streak++;st[0]++;}
  else{C.streak=0;const bag=C.bag[q.key];if(bag)bag.splice(Math.min(bag.length,8+rand(5)),0,q.s);}
  markDay();save();render();
}
function ruleText(cs,a){
  if(cs==='nom')return 'Im Nominativ bleiben die Formen gleich: der · die · das (ein · eine · ein).';
  if(cs==='akk')return a==='der'?'Nur maskulin ändert sich: der wird zu <b>den</b> (ein wird zu <b>einen</b>). Feminin und Neutrum bleiben gleich.':'Feminin und Neutrum bleiben im Akkusativ gleich. Nur maskulin ändert sich (der wird zu den).';
  return a==='die'?'Feminin im Dativ: die wird zu <b>der</b> (eine wird zu <b>einer</b>).':'Maskulin und Neutrum im Dativ: <b>dem</b> (ein wird zu <b>einem</b>).';
}
function weakForm(q){
  const m=q.s.t.split('___')[1]||'';
  const re=new RegExp('^ '+q.e.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-zÄÖÜäöüß])');
  if(re.test(m))return null;
  const mm=m.match(/^ ([^\s.,?!]+)/);
  return mm?mm[1]:null;
}
function viewCases(){
  if(!C.q)newCase();
  const q=C.q,sn=q.s;
  const isWo=sn.c==='wod'||sn.c==='woa';
  const m=(v,l)=>'<button class="chip '+(C.mode===v?'on':'')+'" data-a="cmode" data-v="'+v+'">'+l+'</button>';
  let h='<h2 class="h2">Fälle üben</h2><div class="chips">'+m('nom','Nominativ')+m('akk','Akkusativ')+m('dat','Dativ')+m('wo','Wo? / Wohin?')+m('mix','Mix')+'</div>'+
    '<div class="chips" style="margin-top:10px"><button class="chip '+(!C.indef?'on':'')+'" data-a="cdef" data-v="d">der / die / das</button>'+
    '<button class="chip '+(C.indef?'on':'')+'" data-a="cdef" data-v="i">ein / eine</button></div>';
  let tag;
  if(C.ans)tag=CN[q.cs]+' ('+(isWo?(sn.c==='wod'?'Wo?':'Wohin?'):CQ[q.cs])+')';
  else if(C.mode==='mix')tag='Welcher Fall?';
  else if(C.mode==='wo')tag='Wo? oder Wohin?';
  else tag=CN[q.cs]+' ('+CQ[q.cs]+')';
  const parts=sn.t.split('___');
  const blank=C.ans?'<span class="blank filled c-'+q.e.art+'">'+esc(parts[0]===''?cap(q.form):q.form)+'</span>':'<span class="blank">&nbsp;</span>';
  h+='<div class="card qcard" style="margin-top:14px;text-align:left"><div class="tag">'+esc(tag)+'</div>'+
    '<div class="sentence">'+esc(parts[0])+blank+esc(parts[1])+'</div>'+
    '<div class="tr" style="text-align:left">'+trans(q.e)+'</div>';
  if(C.ans){
    const ok=C.ans===q.form,wf=weakForm(q);
    h+='<div class="fb '+(ok?'ok':'no')+'"><div class="row1"><span>'+(ok?'Richtig!':'Nicht ganz. Richtig ist: <b>'+esc(q.form)+'</b>')+'</span></div>'+
      '<div class="tip"><b>'+esc(sn.h)+'</b></div>'+
      '<div class="tip">'+ruleText(q.cs,q.e.art)+'</div>'+
      (wf?'<div class="tip">Achtung: <b>'+esc(q.e.w)+'</b> bekommt hier ein Extra-<b>n</b>: <b>'+esc(wf)+'</b> (N-Deklination).</div>':'')+'</div>';
  }
  h+='</div><div class="opts">';
  OPTS[C.indef?'i':'d'].forEach(o=>{
    let st='';
    if(C.ans)st=o===q.form?' right':(o===C.ans?' wrong':' dim');
    h+='<button class="opt'+st+'" data-a="cans" data-v="'+o+'"'+(C.ans?' disabled':'')+'>'+o+'</button>';
  });
  h+='</div>';
  if(C.ans)h+='<button class="btn" data-a="cnext">Weiter</button>';
  h+='<p class="small">'+C.right+' von '+C.total+' richtig'+(C.streak>1?' · '+C.streak+' in Folge':'')+'</p>';
  return h;
}

/* ---------- Wörter ---------- */
function filtered(){
  const q=W.q.trim().toLowerCase();
  return WORDS.filter(e=>{
    if(W.grp!=='all'&&e.grp!==W.grp)return false;
    if(W.flag&&!S.flags[e.id])return false;
    if(!q)return true;
    return (e.w+' '+e.en+' '+e.uk).toLowerCase().indexOf(q)>=0;
  });
}
function wordList(){
  const l=filtered();
  if(!l.length)return '<p class="small">Keine Treffer.</p>';
  return '<div class="card" style="padding:6px 16px">'+l.map(e=>
    '<div class="row"><div class="rw"><div class="w"><span class="a c-'+e.art+'">'+e.art+'</span>'+esc(e.w)+'</div>'+
    '<div class="t">'+esc(e.en)+'</div><div class="t">'+esc(e.uk)+'</div></div>'+
    (canSpeak?'<button class="icon" data-a="say" data-v="'+e.i+'" aria-label="Vorlesen">'+ic(IC.speaker,20)+'</button>':'')+
    '<button class="icon'+(S.flags[e.id]?' on':'')+'" data-a="flag" data-v="'+e.i+'" aria-label="Markieren">'+ic(IC.flag,20)+'</button></div>'
  ).join('')+'</div>';
}
function viewWords(){
  const nf=Object.keys(S.flags).filter(k=>S.flags[k]).length;
  const g=(v,l)=>'<button class="'+(W.grp===v?'on':'')+'" data-a="wgrp" data-v="'+v+'">'+l+'</button>';
  let h='<h2 class="h2">Wörter</h2><div class="card"><input id="q" class="search" type="search" placeholder="Suchen: Wort, English, Українська" value="'+esc(W.q)+'" autocomplete="off">'+
    '<div class="seg" style="margin-top:12px">'+g('all','Alle')+g('alltag','Alltag')+g('job','Beruf')+'</div>'+
    '<div class="chips" style="margin-top:12px"><button class="chip '+(W.flag?'on':'')+'" data-a="wflag">Markiert ('+nf+')</button>'+
    (nf?'<button class="chip" data-a="copyflags">Liste kopieren</button>':'')+'</div>'+
    (W.copy?'<textarea readonly id="cp">'+esc(W.copy)+'</textarea>':'')+
    '<p class="small" style="text-align:left">Fehler gefunden? Tippe die Flagge, um ein Wort zu markieren.</p></div>'+
    '<div id="wl" style="margin-top:14px">'+wordList()+'</div>';
  return h;
}
function copyFlags(){
  const txt=WORDS.filter(e=>S.flags[e.id]).map(e=>e.art+' '+e.w+' | '+e.en+' | '+e.uk).join('\n');
  const fallback=()=>{W.copy=txt;render();};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),fallback);}catch(err){fallback();}
}

/* ---------- Regeln ---------- */
function viewRules(){
  const tb=(rows,later)=>'<table class="tbl"><thead><tr><th></th><th class="c-der">maskulin</th><th class="c-die">feminin</th><th class="c-das">neutrum</th></tr></thead><tbody>'+
    rows.map((r,i)=>'<tr'+(later&&i===3?' class="later"':'')+'><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</tbody></table>';
  return '<h2 class="h2">Regeln</h2>'+
    '<div class="card"><h3>Bestimmter Artikel</h3>'+tb([['Nominativ','der','die','das'],['Akkusativ','<b>den</b>','die','das'],['Dativ','<b>dem</b>','<b>der</b>','<b>dem</b>'],['Genitiv (später)','des','der','des']],true)+
    '<h3 style="margin-top:18px">Unbestimmter Artikel</h3>'+tb([['Nominativ','ein','eine','ein'],['Akkusativ','<b>einen</b>','eine','ein'],['Dativ','<b>einem</b>','<b>einer</b>','<b>einem</b>'],['Genitiv (später)','eines','einer','eines']],true)+
    '<p class="small" style="text-align:left">Fett = Form ändert sich. Im Akkusativ ändert sich nur maskulin.</p></div>'+
    '<div class="card rl"><h3>Welcher Fall?</h3>'+
    '<p><b>Nominativ</b> (Wer? Was?): das Subjekt. <i>Der Tisch ist neu.</i></p>'+
    '<p><b>Akkusativ</b> (Wen? Was?): das Objekt nach den meisten Verben (brauchen, sehen, suchen, kaufen) und nach <b>für, durch, ohne, gegen, um, bis</b>.</p>'+
    '<p><b>Dativ</b> (Wem?): nach <b>aus, bei, mit, nach, seit, von, zu, gegenüber</b> und nach Verben wie helfen, gehören, danken, gefallen.</p>'+
    '<p><b>Wechselpräpositionen</b> (in, an, auf, hinter, neben, über, unter, vor, zwischen): <b>Wo?</b> gibt Dativ, <b>Wohin?</b> gibt Akkusativ.<br><i>Ich bin in der Küche. Ich gehe in die Küche.</i></p></div>'+
    '<div class="card rl"><h3>Endungen helfen</h3>'+
    '<p><span class="c-die"><b>die</b></span>: -ung, -heit, -keit, -schaft, -tät, -ion, -enz, -ur, -ik, -ie, -in (Frauen), meist -e</p>'+
    '<p><span class="c-das"><b>das</b></span>: -chen, -lein, -ment, -nis, -um</p>'+
    '<p><span class="c-der"><b>der</b></span>: -ling, Tage, Monate und Jahreszeiten (der Montag, der Mai, der Winter)</p>'+
    '<p><b>Zusammengesetzte Wörter</b>: Das letzte Wort entscheidet. Schlaf<b>zimmer</b> ist <b>das</b>, weil es <b>das Zimmer</b> heißt.</p>'+
    '<p class="small" style="text-align:left">Es gibt Ausnahmen. Die App zeigt sie an.</p></div>';
}

/* ---------- Fortschritt ---------- */
function viewProgress(){
  const st=stats();
  let sure=0;WORDS.forEach(e=>{const x=S.w[e.id];if(x&&x.b>=3)sure++;});
  let h='<h2 class="h2">Fortschritt</h2><div class="stats"><div class="stat"><b>'+dayStreak()+'</b><span>Tage in Folge</span></div>'+
    '<div class="stat"><b>'+st.seen+'</b><span>von '+WORDS.length+' geübt</span></div>'+
    '<div class="stat"><b>'+st.acc+'%</b><span>richtig</span></div></div>'+
    '<div class="card"><h3>Themen</h3><p class="small" style="text-align:left;margin:6px 0 4px">Hell: geübt. Dunkel: sicher (mehrmals in Folge richtig). Sicher gelernt: '+sure+' von '+WORDS.length+'.</p>';
  Object.keys(CATS).forEach(k=>{
    const l=WORDS.filter(e=>e.cat===k);
    const seen=l.filter(e=>S.w[e.id]).length;
    const sr=l.filter(e=>S.w[e.id]&&S.w[e.id].b>=3).length;
    h+='<div class="prog"><span>'+esc(CATS[k][0])+'</span><span class="n">'+seen+' / '+l.length+' geübt'+(sr?' · '+sr+' sicher':'')+'</span>'+
      '<div class="bar"><i class="seen" style="width:'+Math.round(100*seen/l.length)+'%"></i><i style="width:'+Math.round(100*sr/l.length)+'%"></i></div></div>';
  });
  h+='</div>';
  const rows=[['nom','Nominativ'],['akk','Akkusativ'],['dat','Dativ'],['wo','Wo? / Wohin?']];
  h+='<div class="card"><h3>Fälle</h3>'+rows.map(r=>{
    const c=S.cs[r[0]]||[0,0];
    return '<div class="prog"><span>'+r[1]+'</span><span class="n">'+(c[1]?c[0]+' von '+c[1]+' richtig':'noch nicht geübt')+'</span>'+
      '<div class="bar"><i style="width:'+(c[1]?Math.round(100*c[0]/c[1]):0)+'%"></i></div></div>';
  }).join('')+'</div>';
  const hard=WORDS.filter(e=>S.w[e.id]&&S.w[e.id].w>0&&S.w[e.id].b<3).sort((a,b)=>S.w[b.id].w-S.w[a.id].w).slice(0,10);
  if(hard.length)h+='<div class="card" style="padding:6px 16px"><h3 style="margin:12px 0 2px">Schwierige Wörter</h3>'+hard.map(rowSimple).join('')+'</div>';
  h+='<div class="card rl"><h3>Version '+VERSION+' ('+BUILD+')</h3>'+
    '<p><b>1.1.1:</b> kleiner Gruß auf dem Startbildschirm.</p><p><b>Fälle:</b> '+SENT.length+' Sätze von Hand geschrieben, mit wechselnden Verben und Präpositionen.</p>'+
    '<p><b>Weiter:</b> Die Antwort bleibt stehen, bis du auf Weiter tippst.</p>'+
    '<p><b>Fortschritt:</b> zeigt geübte und sichere Wörter sowie die Fälle.</p>'+
    '<p><b>Wörter:</b> Einträge geprüft, einige Übersetzungen korrigiert.</p></div>';
  h+='<button class="btn ghost" style="margin-top:14px" data-a="reset">'+(resetAsk?'Wirklich alles löschen? Nochmal tippen':'Fortschritt zurücksetzen')+'</button>';
  return h;
}

/* ---------- Rendern ---------- */
function render(scroll){
  const v={ueben:viewPractice,faelle:viewCases,woerter:viewWords,regeln:viewRules,fortschritt:viewProgress}[tab];
  const y=window.scrollY;
  $('#app').innerHTML=v();
  $('#nav').innerHTML=TABS.map(t=>'<button class="tab'+(t[0]===tab?' on':'')+'" data-a="tab" data-v="'+t[0]+'">'+ic(IC[t[0]])+'<span>'+t[1]+'</span></button>').join('');
  window.scrollTo(0,scroll?0:y);
}

const ACT={
  tab:v=>{tab=v;resetAsk=false;render(true);},
  grp:v=>{cfg.grp=v;cfg.cat='all';render();},
  tr:v=>{S[v]=!S[v];save();render();},
  start:()=>startRound(),
  quit:()=>quit(),
  ans:v=>answer(v),
  next:()=>next(),
  say:v=>{const e=WORDS[+v];speak(e.art+' '+e.w);},
  cmode:v=>{C.mode=v;newCase();render();},
  cdef:v=>{C.indef=(v==='i');newCase();render();},
  cans:v=>caseAnswer(v),
  cnext:()=>{newCase();render();},
  wgrp:v=>{W.grp=v;render();},
  wflag:()=>{W.flag=!W.flag;render();},
  flag:v=>{const e=WORDS[+v];if(S.flags[e.id])delete S.flags[e.id];else S.flags[e.id]=1;save();render();},
  copyflags:()=>copyFlags(),
  reset:()=>{
    if(!resetAsk){resetAsk=true;render();return;}
    const f=S.flags;S=defaults();S.flags=f;save();resetAsk=false;Q=null;toast('Zurückgesetzt');render();
  }
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(!el)return;
  const f=ACT[el.dataset.a];
  if(f)f(el.dataset.v,el);
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='cat'){cfg.cat=ev.target.value;render();}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){W.q=ev.target.value;const l=$('#wl');if(l)l.innerHTML=wordList();}
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  const t=document.activeElement&&document.activeElement.tagName;
  if(t==='BUTTON'||t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
  const b=document.querySelector('[data-a=next],[data-a=cnext]');
  if(b){ev.preventDefault();b.click();}
});
render(true);
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
</body>
</html>
